plugins {
    id 'java'
    id 'application'
}

group = 'cp26'
version = '0.1.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation('tools.jackson.core:jackson-databind:3.2.0')
    implementation('org.jcommander:jcommander:3.0')

  	testImplementation(platform('org.junit:junit-bom:6.1.0'))
  	testImplementation('org.junit.jupiter:junit-jupiter')
  	testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

javadoc {
    options.encoding = 'UTF-8'
}

jar {
    archiveFileName = 'simulator.jar'
    destinationDirectory = file("$rootDir/out")
    compileJava.options.encoding = 'UTF-8'
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    manifest {
        attributes('Main-Class': 'cp26.Simulator')
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

application {
    mainClass.set('cp26.Simulator')
}

test {
	useJUnitPlatform()
	testLogging {
	    outputs.upToDateWhen {false}
	    showStandardStreams = true

		events "passed", "skipped", "failed"
	}
}

tasks.withType(Test).configureEach {
    enableAssertions = !project.findProperty('disableAssertions')?.toBoolean()
}
