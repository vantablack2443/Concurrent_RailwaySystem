# Tests the simulator and deploys the visualization page in site/ to GitHub
# Pages. The page data in site/data is recorded locally (`just viz-record`,
# `just viz-bench`) and committed, so CI does not re-record it.
#
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: Test and deploy page

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Never cancel a Pages deployment halfway.
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --release -p train-sim-tests -- --test-threads=1
      - name: Build with viz instrumentation
        run: cargo build --release -p train-sim --features viz
      - name: Check page data is present
        run: |
          for f in island.viz.json europe_500.viz.json bench.json; do
            test -s "site/data/$f" || { echo "missing site/data/$f, run just viz-record and just viz-bench"; exit 1; }
          done

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
